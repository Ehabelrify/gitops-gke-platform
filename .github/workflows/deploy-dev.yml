name: Build and Deploy to Dev

on:
  push:
    branches: [main]
    paths:
      - 'app/**'

permissions:
  contents: write
  id-token: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/573221342208/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-actions-ci@gitops-gke-pipeline-503620.iam.gserviceaccount.com

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Build and push image
        run: |
          IMAGE=us-central1-docker.pkg.dev/gitops-gke-pipeline-503620/gitops-gke-app/gitops-gke-app
          TAG=${{ github.sha }}
          docker build -t $IMAGE:$TAG ./app
          docker push $IMAGE:$TAG

      - name: Update dev image tag
        run: |
          sed -i "s/newTag: .*/newTag: ${{ github.sha }}/" k8s/overlays/dev/kustomization.yaml

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/overlays/dev/kustomization.yaml
          git commit -m "ci: deploy ${{ github.sha }} to dev" || echo "nothing to commit"
          git push
